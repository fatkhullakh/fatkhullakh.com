# Cloudflare Pages settings. The database stores reads, likes and comments.
name = "fatkhullakh-com"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "fatkhullakh-db"
database_id = "b49af410-666f-455d-8d32-bf0574965fd3" # from `npx wrangler d1 create fatkhullakh-db`
migrations_dir = "migrations"
